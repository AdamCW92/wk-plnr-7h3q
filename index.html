<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Week Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Week">
<meta name="theme-color" content="#5b3df5">
<style>
/* Standalone, offline planner. Saves to this browser; "Share" exports/imports a file or code between devices. Print view lays the week out on A4/A3 landscape. */
:root{
  --bg:#fbfaff; --surface:#ffffff; --fg:#1d1a33; --muted:#6b6786; --line:#e6e3f2; --shadow:0 6px 20px rgba(60,40,120,.10);
  --accent:#5b3df5; --accent-fg:#ffffff;
  --c-school:#3d7bff; --c-travel:#9aa3b5; --c-activity:#ff4f8b; --c-homework:#8b5cf6; --c-food:#ff9a1f; --c-chill:#19c37d; --c-routine:#19b6e6; --c-prep:#f5c518;
  --now:#ff3b30;
  --display:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12111f; --surface:#1c1a2e; --fg:#f3f1ff; --muted:#a8a4c4; --line:#2c2945; --shadow:0 6px 20px rgba(0,0,0,.35);
  --accent:#a78bfa; --accent-fg:#12111f; --c-travel:#7b8398; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12111f; --surface:#1c1a2e; --fg:#f3f1ff; --muted:#a8a4c4; --line:#2c2945; --shadow:0 6px 20px rgba(0,0,0,.35);
  --accent:#a78bfa; --accent-fg:#12111f; --c-travel:#7b8398; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top h1 .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c-activity),var(--c-food))}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:800;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent)}
.status{font-size:.8rem;color:var(--muted);font-weight:700}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:1500px;margin:0 auto}

.today{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.today{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.clock{font-family:var(--display);font-size:clamp(3rem,10vw,6.5rem);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.date{font-size:1.1rem;color:var(--muted);font-weight:800}
.nowcard{border-radius:22px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:4px;min-width:0}
.nowcard .eyebrow,.nextcard .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.85}
.nowcard .big{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.1}
.nowcard .when{font-weight:800;font-variant-numeric:tabular-nums;opacity:.9}
.nextcard{border:2px dashed var(--line);border-radius:22px;padding:14px 18px;color:var(--muted);font-weight:800}
.nextcard b{color:var(--fg);font-family:var(--display);font-size:1.15rem;font-weight:600}
.bring{background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.bring .icon{width:40px;height:40px;border-radius:12px;background:var(--c-prep);flex:none;display:grid;place-items:center;color:#1d1a33;font-weight:800}
.bring h3{font-size:1rem;margin-bottom:2px}
.bring p{margin:0;white-space:pre-wrap}
.bring p.empty{color:var(--muted)}

.timeline{display:flex;flex-direction:column;gap:8px;min-width:0}
.timeline h2{font-size:1.2rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
.block{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-radius:16px;padding:10px 12px;border-left:8px solid var(--c);text-align:left;border-top:0;border-right:0;border-bottom:0;min-width:0;width:100%}
.block .t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;line-height:1.2}
.block .ttl{font-weight:800;min-width:0;overflow-wrap:anywhere}
.block .ttl small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
.block .cat{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.block.now{outline:3px solid var(--now);outline-offset:0;box-shadow:var(--shadow)}
.block.done{opacity:.5}
.block.done .ttl{text-decoration:line-through}
.wall .block.done{display:none}

.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.daytabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--muted)}
.daytabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.week{display:grid;grid-template-columns:1fr;gap:14px}
.day{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today-col{outline:3px solid var(--accent)}
.day h3{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.day h3 span{font-size:.75rem;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.day .block{grid-template-columns:auto 1fr;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.day .block .cat{display:none}
.day .block .t{font-size:.8rem}
.day .bringline{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;white-space:pre-wrap;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;overflow-wrap:anywhere}
.day .bringline b{color:var(--fg)}
.add{border:2px dashed var(--line);background:transparent;border-radius:12px;padding:8px;color:var(--muted);font-weight:800}
.add:hover{border-color:var(--accent);color:var(--accent)}
@media (min-width:900px){
  .daytabs{display:none}
  .week{grid-template-columns:repeat(7,minmax(0,1fr))}
  .day .block{grid-template-columns:1fr}
  .day .block .t{order:-1}
}
@media (max-width:899px){ .week .day:not(.active){display:none} }

.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:10px 18px;font-weight:800}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;color:var(--muted)}
.danger{background:transparent;border:1px solid var(--c-activity);color:var(--c-activity);border-radius:999px;padding:8px 14px;font-weight:800}
.wall .top .tabs,.wall .add,.wall .edit-only{display:none}
.wall .block{pointer-events:none}
.wall .hero{padding:28px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,16,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--surface);color:var(--fg);width:min(560px,100%);border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:700px){.sheet{align-items:center}.sheet form{border-radius:24px}}
.sheet h2{font-size:1.3rem}
.sheet p{margin:0;color:var(--muted);font-size:.9rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{display:flex;align-items:center;gap:6px;border:2px solid transparent;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem;color:#fff;background:var(--c);cursor:pointer}
.cats input{position:absolute;opacity:0;width:0;height:0}
.cats label:has(input:checked){border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.daypick label{color:var(--fg);background:var(--surface);border-color:var(--line)}
.daypick label:has(input:checked){background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:none}
.copyday{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:8px}
.copyday:hover{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.actions .danger{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:30;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.block{transition:transform .15s}.block:not(.now):hover{transform:translateX(3px)}}

/* ---------- PRINT: one landscape sheet, 7 columns, colour stripes kept ---------- */
.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{--bg:#fff;--surface:#fff;--fg:#111;--muted:#555;--line:#ccc;--shadow:none}
  html,body{background:#fff!important;color:#111!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.sheet,#toast-host,.add,.daytabs,#view-today{display:none!important}
  #view-week{display:block!important}
  main{padding:0;max-width:none}
  .print-only{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #111;margin-bottom:4mm;padding-bottom:1.5mm}
  .print-only h1{font-size:18pt}
  .print-only .legend{display:flex;gap:3mm;font-size:7.5pt;font-weight:800}
  .print-only .legend span{display:inline-flex;align-items:center;gap:1.2mm}
  .print-only .legend i{width:3mm;height:3mm;border-radius:1mm;background:var(--c);display:inline-block}
  .week{display:grid!important;grid-template-columns:repeat(7,1fr);gap:2mm}
  .week .day{display:flex!important;box-shadow:none;border:1px solid #bbb;border-radius:2mm;padding:2mm;gap:1mm;outline:0;break-inside:avoid}
  .day.today-col{outline:0}
  .day h3{font-size:11pt;border-bottom:1px solid #ddd;padding-bottom:1mm}
  .day h3 span{display:none}
  .day .block{grid-template-columns:1fr;gap:0;padding:1mm 1.5mm;border-radius:1.5mm;border-left:2.5mm solid var(--c);background:#f6f6f6;font-size:7.5pt;line-height:1.2}
  .day .block .t{order:-1;font-size:6.5pt;color:#444}
  .day .block .t br{display:none}
  .day .block .t::after{content:""}
  .day .block .ttl{font-size:7.5pt}
  .day .block .ttl small{font-size:6pt;color:#555}
  .day .bringline{font-size:7pt;padding-top:1mm;border-top:1px dashed #bbb;margin-top:auto}
  .day .bringline i{color:#999}
}
</style>

/* In-page poster builder (jsPDF). buildPoster(plan, "A4"|"A3") -> jsPDF doc */
const POSTER=(()=>{
const DAYS=[["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],["thu","Thursday"],["fri","Friday"],["sat","Saturday"],["sun","Sunday"]];
const CATS={school:"#3d7bff",travel:"#9aa3b5",activity:"#ff4f8b",homework:"#8b5cf6",food:"#ff9a1f",chill:"#19c37d",routine:"#19b6e6",prep:"#f5c518"};
const LABELS={school:"School",activity:"Clubs",homework:"Homework",food:"Food",chill:"Free time",routine:"Routine",prep:"Get ready"};
const DAYHUE=["#ffe3ec","#fff1d6","#e6f7ff","#e9fbef","#f3e9ff","#fff9d6","#e3f0ff"];
const INK="#2b2550",MUTED="#6b6786",PAPER="#fffdf7",DARK=new Set(["prep","food","chill","travel","routine"]);
const mins=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
function fonts(doc){
  doc.addFileToVFS("Poppins-Bold.ttf",POPPINS_BOLD); doc.addFont("Poppins-Bold.ttf","Poppins","bold");
  doc.addFileToVFS("Poppins-Medium.ttf",POPPINS_MEDIUM); doc.addFont("Poppins-Medium.ttf","Poppins","normal");
}
function build(plan,size){
  const s=size==="A3"?1.4:1, doc=new jspdf.jsPDF({orientation:"landscape",unit:"mm",format:size.toLowerCase()});
  fonts(doc); doc.setFont("Poppins","bold");
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const pt=p=>p*0.3528; // points -> mm
  const text=(t,x,y,f,sz,col,opt)=>{doc.setFont("Poppins",f);doc.setFontSize(sz);doc.setTextColor(col);doc.text(t,x,y,opt||{baseline:"alphabetic"})};
  const tw=(t,f,sz)=>{doc.setFont("Poppins",f);doc.setFontSize(sz);return doc.getTextWidth(t)};
  const fit=(t,f,sz,w)=>{while(tw(t,f,sz)>w&&t.length>3)t=t.slice(0,-2)+"…";return t};
  const rnd=(x,y,w,h,r,col,stroke)=>{doc.setFillColor(col);if(stroke){doc.setDrawColor(stroke);doc.setLineWidth(0.3);doc.roundedRect(x,y,w,h,r,r,"FD")}else doc.roundedRect(x,y,w,h,r,r,"F")};
  const star=(x,y,r,col)=>{doc.setFillColor(col);const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;pts.push([x+rr*Math.cos(a),y+rr*Math.sin(a)])}
    const lines=[];for(let i=1;i<pts.length;i++)lines.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);doc.lines(lines,pts[0][0],pts[0][1],[1,1],"F",true)};
  doc.setFillColor(PAPER); doc.rect(0,0,W,H,"F");
  const M=9*s, gap=3*s, title=plan.name||"My Week";
  text(title,M,M+pt(20*s),"bold",26*s,INK);
  const ttw=tw(title,"bold",26*s);
  star(M+ttw+pt(9*s),M+pt(10*s),pt(6*s),CATS.prep); star(M+ttw+pt(20*s),M+pt(16*s),pt(3.5*s),CATS.activity);
  text("One week, sorted. Big blocks, no fuss.",M,M+pt(32*s),"normal",9*s,MUTED);
  let x=W-M;
  for(const k of Object.keys(LABELS).reverse()){ const n=LABELS[k], w=tw(n,"normal",8*s); x-=w; text(n,x,M+pt(18*s),"normal",8*s,INK);
    x-=pt(5.5*s); doc.setFillColor(CATS[k]); doc.circle(x,M+pt(15.5*s),pt(2.6*s),"F"); x-=pt(10*s); }
  const top=M+pt(40*s), footerH=18*s, bottom=H-M-footerH-gap, colw=(W-2*M-6*gap)/7;
  DAYS.forEach(([k,name],i)=>{
    const d=plan.days[k]||{blocks:[],bring:""}, blocks=[...d.blocks].sort((a,b)=>mins(a.start)-mins(b.start)), x0=M+i*(colw+gap);
    rnd(x0,top,colw,bottom-top,4*s,DAYHUE[i]);
    text(name,x0+colw/2,top+7*s,"bold",13*s,INK,{align:"center"});
    const bh=9*s, bring=(d.bring||"").trim(), by=bottom-bh+4.8*s;
    text("BRING",x0+3*s,by,"bold",7*s,MUTED);
    const bw=tw("BRING ","bold",7*s);
    if(bring) text(fit(bring.replace(/\n/g,", "),"normal",7.5*s,colw-6*s-bw),x0+3*s+bw,by,"normal",7.5*s,INK);
    else { doc.setDrawColor("#c9c4de"); doc.setLineWidth(0.3); doc.setLineDashPattern([1,1.5],0); doc.line(x0+3*s+bw+1,by+0.8,x0+colw-3*s,by+0.8); doc.setLineDashPattern([],0); }
    const yTop=top+10.5*s, avail=(bottom-bh-1.5*s)-yTop, n=Math.max(blocks.length,1), bgap=1.6*s;
    const hb=Math.min(21*s,(avail-(n-1)*bgap)/n); let y=yTop;
    for(const b of blocks){
      const col=CATS[b.cat]||"#999", txt=DARK.has(b.cat)?INK:"#ffffff";
      rnd(x0+2.2*s,y,colw-4.4*s,hb,2.6*s,col);
      const tx=x0+4.2*s, w=colw-8.4*s, when=b.end===b.start?b.start:b.start+" – "+b.end;
      let ts=Math.min(9.5*s,hb*0.42/0.3528); while(tw(b.title,"bold",ts)>w&&ts>6.5*s)ts-=0.25;
      const small=Math.min(7*s,hb*0.3/0.3528);
      if(hb>=9*s){
        text(when,tx,y+1.3*s+pt(small),"normal",small,txt);
        const hasNote=b.note&&hb>=13*s;
        text(fit(b.title,"bold",ts,w),tx,y+hb-1.8*s-(hasNote?pt(small)+0.8*s:0),"bold",ts,txt);
        if(hasNote) text(fit(b.note,"normal",small*0.95,w),tx,y+hb-1.6*s,"normal",small*0.95,txt);
      } else {
        text(b.start,tx,y+hb/2+pt(small)/2.8,"normal",small,txt);
        const off=tw("00:00  ","normal",small); text(fit(b.title,"bold",ts,w-off),tx+off,y+hb/2+pt(ts)/2.8,"bold",ts,txt);
      }
      y+=hb+bgap;
    }
  });
  const fy=H-M-footerH; let fw=(W-2*M-gap)*0.58, fx=M;
  rnd(fx,fy,fw,footerH,4*s,"#ffffff","#ece9f6");
  text("Morning, before you leave",fx+5*s,fy+6.5*s,"bold",10*s,INK);
  let ix=fx+5*s; const iy=fy+footerH-5*s;
  for(const it of ["Dressed","Breakfast","Bag checked","Teeth & hair","Shoes & coat"]){
    doc.setDrawColor(CATS.routine); doc.setLineWidth(0.4*s); doc.setFillColor("#ffffff"); doc.circle(ix+2.4*s,iy-1.1*s,2.4*s,"FD");
    text(it,ix+6.5*s,iy,"normal",9*s,INK); ix+=6.5*s+tw(it,"normal",9*s)+5*s; }
  const gx=fx+fw+gap; fw=(W-2*M-gap)*0.42;
  rnd(gx,fy,fw,footerH,4*s,CATS.prep);
  text("Every evening, before free time",gx+5*s,fy+6.5*s,"bold",10*s,INK);
  text("Pack tomorrow's bag  ·  Uniform out  ·  Check the planner  ·  Then relax!",gx+5*s,fy+footerH-5*s,"normal",9*s,INK);
  star(gx+fw-8*s,fy+6*s,3.2*s,CATS.activity);
  return doc;
}
return {build};
})();
</script>

(function(){

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const mins=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+(m||0)};
const dayKey=d=>DAYS[(d.getDay()+6)%7][0];

function starterWeek(){
  const p=JSON.parse(JSON.stringify(STARTER));
  for(const d of Object.values(p.days)) for(const b of d.blocks) b.id=uid();
  return p;
}
const STARTER={"name":"My Week","days":{"mon":{"bring":"Dance kit","blocks":[{"start":"06:30","end":"07:45","title":"Rise & shine","cat":"routine","note":"dressed · breakfast · bag"},{"start":"07:45","end":"15:30","title":"School","cat":"school","note":""},{"start":"15:30","end":"16:00","title":"Snack & chill","cat":"chill","note":""},{"start":"16:00","end":"16:45","title":"Homework","cat":"homework","note":"hardest thing first"},{"start":"16:45","end":"18:15","title":"Dance","cat":"activity","note":"leave 4:45 · home 6:15"},{"start":"18:15","end":"19:00","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"19:30","title":"Pack bag & finish off","cat":"prep","note":"uniform out too"},{"start":"19:30","end":"20:30","title":"Free time","cat":"chill","note":""},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":"screens off · bed 9pm"}]},"tue":{"bring":"Swimming kit","blocks":[{"start":"06:30","end":"07:45","title":"Rise & shine","cat":"routine","note":"dressed · breakfast · bag"},{"start":"07:45","end":"15:30","title":"School","cat":"school","note":""},{"start":"15:30","end":"16:00","title":"Snack & chill","cat":"chill","note":""},{"start":"16:00","end":"16:45","title":"Homework","cat":"homework","note":"hardest thing first"},{"start":"16:45","end":"18:15","title":"Swimming","cat":"activity","note":"lesson 5 · pool fun till 6"},{"start":"18:15","end":"19:00","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"19:30","title":"Pack bag & finish off","cat":"prep","note":"uniform out too"},{"start":"19:30","end":"20:30","title":"Free time","cat":"chill","note":""},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":"screens off · bed 9pm"}]},"wed":{"bring":"","blocks":[{"start":"06:30","end":"07:45","title":"Rise & shine","cat":"routine","note":"dressed · breakfast · bag"},{"start":"07:45","end":"15:30","title":"School","cat":"school","note":""},{"start":"15:30","end":"16:00","title":"Snack & chill","cat":"chill","note":""},{"start":"16:00","end":"16:45","title":"Homework","cat":"homework","note":"hardest thing first"},{"start":"16:45","end":"18:00","title":"Free time","cat":"chill","note":""},{"start":"18:00","end":"19:00","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"19:30","title":"Pack bag & finish off","cat":"prep","note":"uniform out too"},{"start":"19:30","end":"20:30","title":"Free time","cat":"chill","note":""},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":"screens off · bed 9pm"}]},"thu":{"bring":"","blocks":[{"start":"06:30","end":"07:45","title":"Rise & shine","cat":"routine","note":"dressed · breakfast · bag"},{"start":"07:45","end":"15:30","title":"School","cat":"school","note":""},{"start":"15:30","end":"16:00","title":"Snack & chill","cat":"chill","note":""},{"start":"16:00","end":"16:45","title":"Homework","cat":"homework","note":"hardest thing first"},{"start":"16:45","end":"18:00","title":"Free time","cat":"chill","note":""},{"start":"18:00","end":"19:00","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"19:30","title":"Pack bag & finish off","cat":"prep","note":"uniform out too"},{"start":"19:30","end":"20:30","title":"Free time","cat":"chill","note":""},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":"screens off · bed 9pm"}]},"fri":{"bring":"","blocks":[{"start":"06:30","end":"07:45","title":"Rise & shine","cat":"routine","note":"dressed · breakfast · bag"},{"start":"07:45","end":"15:30","title":"School","cat":"school","note":""},{"start":"15:30","end":"18:00","title":"Free time, it's Friday!","cat":"chill","note":""},{"start":"18:00","end":"19:00","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"20:30","title":"Free time","cat":"chill","note":""},{"start":"20:30","end":"21:30","title":"Wind down","cat":"routine","note":"lights out 9:30"}]},"sat":{"bring":"","blocks":[{"start":"08:30","end":"09:30","title":"Lie-in & breakfast","cat":"routine","note":""},{"start":"10:00","end":"11:00","title":"Homework hour","cat":"homework","note":"then the day is yours"},{"start":"11:00","end":"18:00","title":"Free time","cat":"chill","note":""},{"start":"18:00","end":"18:45","title":"Dinner","cat":"food","note":""},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":""}]},"sun":{"bring":"","blocks":[{"start":"08:30","end":"09:30","title":"Lie-in & breakfast","cat":"routine","note":""},{"start":"10:00","end":"11:00","title":"Homework hour","cat":"homework","note":"then the day is yours"},{"start":"11:00","end":"18:00","title":"Free time","cat":"chill","note":""},{"start":"18:00","end":"18:45","title":"Dinner","cat":"food","note":""},{"start":"19:00","end":"19:30","title":"Sunday reset","cat":"prep","note":"Monday bag · uniform ready"},{"start":"20:30","end":"21:00","title":"Wind down","cat":"routine","note":""}]}}};

/* ---------- State (this browser only) ---------- */
let plan=null, view=(location.hash==="#week")?"week":"today", activeDay=dayKey(new Date()), wall=false, done={};
function localLoad(){ try{ const s=localStorage.getItem("plan"); return s?JSON.parse(s):null }catch(e){ return null } }
function save(){ try{ localStorage.setItem("plan",JSON.stringify(plan)); $("#status").textContent="Saved on this device" }catch(e){ $("#status").textContent="Could not save (private browsing?)" } render(); }
function todayStamp(){ return new Date().toISOString().slice(0,10) }

function boot(){
  const lm=location.hash.match(/^#p=([A-Za-z0-9_-]+)$/);
  if(lm){ try{ const p=JSON.parse(decodePlan(lm[1])); if(p&&p.days){ plan=p; try{localStorage.setItem("plan",JSON.stringify(p))}catch(e){}; history.replaceState(null,"","#today"); toast("New plan received"); } }catch(e){} }
  plan=plan||localLoad();
  if(!plan){ plan=starterWeek(); try{localStorage.setItem("plan",JSON.stringify(plan))}catch(e){} $("#status").textContent="Suggested week loaded. Tap anything to change it."; }
  else $("#status").textContent="Saved on this device";
  try{ done=JSON.parse(localStorage.getItem("done:"+todayStamp())||"{}") }catch(e){ done={} }
  $("#legend").innerHTML=Object.entries(CATS).map(([k,n])=>`<span style="--c:var(--c-${k})"><i></i>${n}</span>`).join("");
  render();
}

/* ---------- Rendering ---------- */
function blockHTML(b,opts={}){
  const isNow=opts.now===b.id, isDone=!!(opts.ticks&&done[b.id]);
  return `<button class="block ${isNow?"now":""} ${isDone?"done":""}" style="--c:var(--c-${esc(b.cat)})" data-id="${esc(b.id)}" data-day="${esc(opts.day)}" aria-label="${esc(b.title)}">
    <span class="t">${esc(b.start)}${b.end&&b.end!==b.start?`<br>${esc(b.end)}`:""}</span>
    <span class="ttl">${esc(b.title)}${b.note?`<small>${esc(b.note)}</small>`:""}</span>
    <span class="cat">${esc(CATS[b.cat]||b.cat)}</span></button>`;
}
const sorted=blocks=>[...(blocks||[])].sort((a,b)=>mins(a.start)-mins(b.start));

function renderToday(){
  const host=$("#view-today");
  const now=new Date(), key=dayKey(now), day=plan.days[key]||{blocks:[],bring:""};
  const nowM=now.getHours()*60+now.getMinutes();
  const blocks=sorted(day.blocks);
  let cur=null,next=null;
  for(const b of blocks){ const s=mins(b.start),e=Math.max(mins(b.end),s+1); if(nowM>=s&&nowM<e) cur=cur||b; else if(s>nowM&&!next) next=b; }
  const clock=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  const date=now.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"});
  const nowCard = cur
    ? `<div class="nowcard" style="background:var(--c-${esc(cur.cat)})"><span class="eyebrow">Right now</span><span class="big">${esc(cur.title)}</span><span class="when">${esc(cur.start)}${cur.end!==cur.start?" to "+esc(cur.end):""}</span>${cur.note?`<span class="note">${esc(cur.note)}</span>`:""}</div>`
    : `<div class="nowcard" style="background:var(--c-chill)"><span class="eyebrow">Right now</span><span class="big">Nothing planned</span><span class="when">${blocks.length?"Enjoy the gap":"Add something below"}</span></div>`;
  const nextCard = next ? `<div class="nextcard"><span class="eyebrow">Up next at ${esc(next.start)}</span><br><b>${esc(next.title)}</b></div>` : `<div class="nextcard"><span class="eyebrow">Up next</span><br><b>That's everything for today</b></div>`;
  host.innerHTML=`
    <div class="hero">
      <div><div class="clock">${esc(clock)}</div><div class="date">${esc(date)}</div></div>
      ${nowCard}${nextCard}
      <div class="bring"><span class="icon">!</span><div><h3>Bring today</h3><p class="${day.bring?"":"empty"}">${day.bring?esc(day.bring):"Nothing extra listed. Tap Week to add kit, books or forms for each day."}</p></div></div>
    </div>
    <div class="timeline">
      <h2>${esc(DAYS.find(d=>d[0]===key)[1])}'s plan <span class="status edit-only">tap to tick off · double-tap to edit</span></h2>
      ${blocks.map(b=>blockHTML(b,{now:cur&&cur.id,ticks:true,day:key})).join("")||`<p class="status">No blocks yet for today.</p>`}
      <button class="add" data-add="${key}">+ Add something to today</button>
    </div>`;
}

function renderWeek(){
  const host=$("#view-week"), tk=dayKey(new Date());
  host.innerHTML=`<div class="daytabs" role="tablist">${DAYS.map(([k,n])=>`<button role="tab" data-day-tab="${k}" aria-selected="${k===activeDay}">${n.slice(0,3)}</button>`).join("")}</div>
  <div class="week">${DAYS.map(([k,n])=>{const d=plan.days[k]||{blocks:[],bring:""};return `
    <div class="day ${k===activeDay?"active":""} ${k===tk?"today-col":""}"><h3>${n}<span style="display:flex;gap:6px;align-items:center">${k===tk?"<span>Today</span>":""}<button type="button" class="copyday edit-only" data-copyday="${k}" title="Copy this day to other days">Copy day</button></span></h3>
      ${sorted(d.blocks).map(b=>blockHTML(b,{day:k})).join("")}
      <button class="add" data-add="${k}">+ Add</button>
      <button class="bringline" data-bring="${k}"><b>Bring:</b> ${d.bring?esc(d.bring):"<i>tap to add kit, books, forms…</i>"}</button>
    </div>`}).join("")}</div>`;
}

function render(){
  $("#title").textContent=plan.name||"My Week"; $("#print-title").textContent=plan.name||"My Week";
  $("#tab-today").setAttribute("aria-selected",view==="today"); $("#tab-week").setAttribute("aria-selected",view==="week");
  $("#view-today").hidden=view!=="today"; $("#view-week").hidden=view!=="week";
  renderToday(); renderWeek(); // both kept rendered so print always has the week
}

/* ---------- Editors ---------- */
function sheet(html){ const h=$("#sheet-host"); h.innerHTML=`<div class="sheet">${html}</div>`; const c=$("#f-cancel"); if(c) c.onclick=()=>h.innerHTML=""; return h; }
function openEditor(dayK, block){
  const isNew=!block; const b=block||{id:uid(),start:"16:00",end:"16:30",title:"",cat:"chill",note:""};
  const host=sheet(`<form id="edf">
    <h2>${isNew?"Add to "+DAYS.find(d=>d[0]===dayK)[1]:"Edit block"}</h2>
    <div class="field"><label for="f-title">What</label><input id="f-title" required maxlength="60" value="${esc(b.title)}" placeholder="e.g. Maths homework"></div>
    <div class="row"><div class="field"><label for="f-start">Start</label><input id="f-start" type="time" required value="${esc(b.start)}"></div>
    <div class="field"><label for="f-end">End</label><input id="f-end" type="time" required value="${esc(b.end)}"></div></div>
    <div class="field"><label>Type</label><div class="cats">${Object.entries(CATS).map(([k,n])=>`<label style="--c:var(--c-${k})"><input type="radio" name="cat" value="${k}" ${k===b.cat?"checked":""}>${n}</label>`).join("")}</div></div>
    <div class="field"><label for="f-note">Note (optional)</label><input id="f-note" maxlength="120" value="${esc(b.note)}" placeholder="e.g. bring PE kit"></div>
    ${isNew?"":`<div class="field"><label>Copy this block to</label><div class="cats daypick">${dayChips(dayK)}</div>
    <div class="actions" style="justify-content:flex-start"><button type="button" class="ghost" id="f-copyto">Copy to selected days</button></div></div>`}
    <div class="actions">${isNew?"":'<button type="button" class="danger" id="f-del">Delete</button>'}<button type="button" class="ghost" id="f-cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>`);
  $("#f-title").focus();
  const ct=$("#f-copyto"); if(ct) ct.onclick=()=>{ const targets=pickedDays(host); if(!targets.length){ toast("Pick at least one day"); return }
    const nb=readBlockForm(host,b); for(const k of targets){ plan.days[k]=plan.days[k]||{blocks:[],bring:""}; plan.days[k].blocks.push({...nb,id:uid()}); }
    host.innerHTML=""; save(); toast("Copied to "+targets.length+(targets.length===1?" day":" days")); };
  const del=$("#f-del"); if(del) del.onclick=()=>{ if(del.dataset.armed){ plan.days[dayK].blocks=plan.days[dayK].blocks.filter(x=>x.id!==b.id); host.innerHTML=""; save(); } else { del.dataset.armed="1"; del.textContent="Tap again to delete"; } };
  $("#edf").onsubmit=e=>{ e.preventDefault();
    const nb=readBlockForm(host,b);
    plan.days[dayK]=plan.days[dayK]||{blocks:[],bring:""};
    const i=plan.days[dayK].blocks.findIndex(x=>x.id===b.id);
    if(i>=0) plan.days[dayK].blocks[i]=nb; else plan.days[dayK].blocks.push(nb);
    host.innerHTML=""; save(); };
}
function readBlockForm(host,b){
  const nb={id:b.id,title:$("#f-title").value.trim(),start:$("#f-start").value,end:$("#f-end").value,cat:(host.querySelector('input[name=cat]:checked')||{}).value||"chill",note:$("#f-note").value.trim()};
  if(mins(nb.end)<mins(nb.start)) nb.end=nb.start; return nb;
}
function dayChips(exceptK){ return DAYS.filter(([k])=>k!==exceptK).map(([k,n])=>`<label><input type="checkbox" name="day" value="${k}">${n.slice(0,3)}</label>`).join(""); }
function pickedDays(host){ return [...host.querySelectorAll('input[name=day]:checked')].map(i=>i.value); }
function openCopyDay(dayK){
  const src=plan.days[dayK]||{blocks:[],bring:""}, name=DAYS.find(x=>x[0]===dayK)[1];
  const host=sheet(`<form id="cdf"><h2>Copy ${name} to…</h2>
    <p>${src.blocks.length} block${src.blocks.length===1?"":"s"} will be copied. The "Bring" list stays as it is on each day.</p>
    <div class="field"><label>Days</label><div class="cats daypick">${dayChips(dayK)}</div></div>
    <div class="field"><label>How</label><div class="cats daypick"><label><input type="radio" name="mode" value="replace" checked>Replace those days</label><label><input type="radio" name="mode" value="add">Add to those days</label></div></div>
    <div class="actions"><button type="button" class="ghost" id="f-cancel">Cancel</button><button class="primary" type="submit">Copy</button></div></form>`);
  $("#cdf").onsubmit=e=>{ e.preventDefault(); const targets=pickedDays(host); if(!targets.length){ toast("Pick at least one day"); return }
    const mode=(host.querySelector('input[name=mode]:checked')||{}).value||"replace";
    for(const k of targets){ plan.days[k]=plan.days[k]||{blocks:[],bring:""}; const copies=src.blocks.map(b=>({...b,id:uid()}));
      plan.days[k].blocks=mode==="replace"?copies:plan.days[k].blocks.concat(copies); }
    host.innerHTML=""; save(); toast(name+" copied to "+targets.length+(targets.length===1?" day":" days")); };
}
function openBring(dayK){
  const d=plan.days[dayK]||(plan.days[dayK]={blocks:[],bring:""});
  const host=sheet(`<form id="brf"><h2>Bring on ${DAYS.find(x=>x[0]===dayK)[1]}</h2>
    <div class="field"><label for="f-bring">Kit, books, forms, money…</label><textarea id="f-bring" rows="4" maxlength="300" placeholder="PE kit&#10;Science book&#10;Trip form">${esc(d.bring)}</textarea></div>
    <div class="actions"><button type="button" class="ghost" id="f-cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form>`);
  $("#f-bring").focus();
  $("#brf").onsubmit=e=>{e.preventDefault(); d.bring=$("#f-bring").value.trim(); host.innerHTML=""; save();};
}
function openName(){
  const host=sheet(`<form id="nmf"><h2>Name your planner</h2>
    <div class="field"><label for="f-name">Title</label><input id="f-name" maxlength="30" value="${esc(plan.name||"My Week")}" placeholder="e.g. Ella's Week"></div>
    <div class="actions"><button type="button" class="ghost" id="f-cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form>`);
  $("#f-name").focus();
  $("#nmf").onsubmit=e=>{e.preventDefault(); plan.name=$("#f-name").value.trim()||"My Week"; host.innerHTML=""; save();};
}
function openShare(){
  const code=JSON.stringify(plan), fname=(plan.name||"my-week").replace(/[^\w-]+/g,"-").toLowerCase()+"-plan.json";
  const onWeb=location.protocol==="https:"&&!/claude\.ai$/.test(location.hostname);
  const host=sheet(`<form id="shf"><h2>Send the plan to another phone</h2>
    <p>Each phone keeps its own copy. Send this one from here, then on the other phone open it and tap <b>Load</b>. Nothing goes through any server.</p>
    <div class="actions" style="justify-content:flex-start"><button type="button" class="primary" id="f-send">Send plan…</button>${onWeb?'<button type="button" class="ghost" id="f-link">Copy link</button>':''}<button type="button" class="ghost" id="f-copy">Copy code</button></div>
    <h2 style="font-size:1.05rem;margin-top:6px">Receive a plan</h2>
    <div class="actions" style="justify-content:flex-start"><label class="primary" style="cursor:pointer">Load plan file<input type="file" id="f-file" accept=".json,application/json,text/plain" hidden></label></div>
    <div class="field"><label for="f-code">Or paste a code or link here and press Load</label><textarea id="f-code" rows="3" placeholder="Paste here"></textarea></div>
    <div class="actions"><button type="button" class="danger" id="f-reset">Reset to suggested week</button><button type="button" class="ghost" id="f-cancel">Close</button><button class="primary" type="submit">Load</button></div></form>`);
  const apply=txt=>{ try{ txt=txt.trim(); const m=txt.match(/#p=([A-Za-z0-9+\/=_-]+)/); if(m) txt=decodePlan(m[1]);
      const p=JSON.parse(txt); if(!p||!p.days) throw 0; plan=p; host.innerHTML=""; save(); toast("Plan loaded"); }catch(e){ toast("That doesn't look like a plan"); } };
  $("#f-send").onclick=async()=>{
    const file=new File([code],fname,{type:"application/json"});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:plan.name||"My Week"}); toast("Sent"); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("Plan file saved. Send it from Files."); return; }catch(e){}
    $("#f-copy").click();
  };
  const lk=$("#f-link"); if(lk) lk.onclick=()=>{ const url=location.origin+location.pathname+"#p="+encodePlan(code); (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copied. Paste it into a message."),()=>{ $("#f-code").value=url; $("#f-code").select(); toast("Select the link and copy it"); }); };
  $("#f-copy").onclick=()=>{ const ta=$("#f-code"); ta.value=code; ta.select(); (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast("Code copied. Paste it into a message."),()=>toast("Select the code and copy it")); };
  $("#f-file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>apply(r.result); r.readAsText(f); };
  const rs=$("#f-reset"); rs.onclick=()=>{ if(rs.dataset.armed){ plan=starterWeek(); host.innerHTML=""; save(); } else { rs.dataset.armed="1"; rs.textContent="Tap again to reset"; } };
  $("#shf").onsubmit=e=>{ e.preventDefault(); apply($("#f-code").value); };
}
function encodePlan(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function decodePlan(b){ b=b.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="="; return decodeURIComponent(escape(atob(b))); }
function openPrint(){
  sheet(`<form id="prf"><h2>Print the week</h2><p>Makes a poster PDF from the plan as it is right now. On an iPhone or iPad it lands in Files (or opens straight away), then Share → Print.</p>
    <div class="field"><label for="f-size">Paper</label><select id="f-size"><option value="A4">A4 landscape</option><option value="A3">A3 landscape (bigger, best for the wall)</option></select></div>
    <div class="actions"><button type="button" class="ghost" id="f-cancel">Cancel</button><button type="button" class="ghost" id="f-browser">Print this page instead</button><button class="primary" type="submit">Make poster PDF</button></div></form>`);
  $("#f-browser").onclick=()=>{ $("#sheet-host").innerHTML=""; setTimeout(()=>window.print(),50); };
  $("#prf").onsubmit=e=>{ e.preventDefault(); const size=$("#f-size").value;
    try{ if(!window.jspdf||!window.POSTER) throw new Error("builder missing"); const doc=POSTER.build(plan,size);
      doc.save((plan.name||"my-week").replace(/[^\w-]+/g,"-").toLowerCase()+"-poster-"+size+".pdf"); $("#sheet-host").innerHTML=""; toast("Poster ready"); }
    catch(err){ toast("Couldn't build the PDF here. Use 'Print this page instead'."); console.error(err); } };
}
let toastT; function toast(msg){ const h=$("#toast-host"); h.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>h.innerHTML="",2600); }

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="tab-today"||t.id==="tab-week"){ view=t.id==="tab-today"?"today":"week"; history.replaceState(null,"","#"+view); render(); return }
  if(t.id==="btn-wall"){ wall=!wall; document.documentElement.classList.toggle("wall",wall); t.classList.toggle("on",wall); t.textContent=wall?"Exit wall mode":"Wall mode"; if(wall) keepAwake(); return }
  if(t.id==="btn-name"){ openName(); return }
  if(t.id==="btn-share"){ openShare(); return }
  if(t.id==="btn-print"){ openPrint(); return }
  if(t.dataset.dayTab){ activeDay=t.dataset.dayTab; render(); return }
  if(t.dataset.add){ openEditor(t.dataset.add); return }
  if(t.dataset.bring){ openBring(t.dataset.bring); return }
  if(t.dataset.copyday){ openCopyDay(t.dataset.copyday); return }
  if(t.classList.contains("block")){
    const k=t.dataset.day, b=(plan.days[k]||{blocks:[]}).blocks.find(x=>x.id===t.dataset.id); if(!b) return;
    if(view==="today"&&!wall){ done[b.id]=!done[b.id]; try{localStorage.setItem("done:"+todayStamp(),JSON.stringify(done))}catch(x){}; render(); }
    else openEditor(k,b);
  }
});
document.addEventListener("dblclick",e=>{ const t=e.target.closest(".block"); if(t&&view==="today"&&!wall){ const k=t.dataset.day; openEditor(k,plan.days[k].blocks.find(x=>x.id===t.dataset.id)); } });
window.addEventListener("hashchange",()=>{ view=location.hash==="#week"?"week":"today"; render(); });
let lastMin=-1; setInterval(()=>{ const m=new Date().getMinutes(); if(m!==lastMin){ lastMin=m; if(!$("#sheet-host").firstChild) render(); } },5000);
async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen") }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(wall&&document.visibilityState==="visible") keepAwake() });

boot();
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
